<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intelscraperstudio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.6" stroke-width="1.6"/><path d="M15.38 11.09L12.6 21.48M14.47 14.47L4.09 17.26M11.09 15.38L3.49 7.78M8.62 12.91L11.4 2.52M9.53 9.53L19.91 6.74M12.91 8.62L20.51 16.22" stroke-width="1.25"/><path class="pupil" d="M15.38 11.09L14.47 14.47L11.09 15.38L8.62 12.91L9.53 9.53L12.91 8.62Z" stroke-width="1.25"/><circle class="dot-rec" cx="12" cy="12" r="1.25" stroke="none"/><circle class="glint" cx="10.6" cy="10.5" r=".55" stroke="none"/></svg></span>
      <b class="wm">intelscraper<span>studio</span></b>
    </div>
    <nav class="nav" id="nav">
      <div class="eyebrow nav-label">Workflow</div>
      <a href="#studio" data-v="studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Studio</span></a>
      <a href="#review" data-v="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M15 17.5l2 2 4-4"/></svg><span class="lbl">Review clips</span><span class="count" id="navReview" hidden></span></a>
      <a href="#music" data-v="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span class="lbl">Music library</span></a>
      <a href="#soon" data-v="soon" class="soon" data-what="The video editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg><span class="lbl">Video editor</span><span class="tag">Soon</span></a>
      <a href="#soon" data-v="soon" class="soon" data-what="Post approval"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20l16-8L4 4l2 8zM6 12h7"/></svg><span class="lbl">Approve posts</span><span class="tag">Soon</span></a>
      <a href="#soon" data-v="soon" class="soon" data-what="Blog publishing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span class="lbl">Blog &amp; portfolio</span><span class="tag">Soon</span></a>
      <a href="#soon" data-v="soon" class="soon" data-what="The posting schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="lbl">Schedule</span><span class="tag">Soon</span></a>
      <div class="eyebrow nav-label">Setup</div>
      <a href="#settings" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">Settings</span></a>
    </nav>
    <div class="side-foot">
      <div class="device" id="device">
        <div class="row"><b style="font-weight:600"><span class="dot" id="devDot"></span>This PC</b><span class="dim mono" id="devOs"></span></div>
        <div class="row muted"><span id="gpuName">Checking GPU…</span><span class="mono" id="gpuPct"></span></div>
        <div class="meter"><i id="gpuBar" style="width:0%"></i></div>
        <div class="row dim"><span>Library drive</span><span class="mono" id="diskTxt">–</span></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <section class="view" id="v-studio"></section>
    <section class="view" id="v-review" hidden></section>
    <section class="view" id="v-music" hidden></section>
    <section class="view" id="v-settings" hidden></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
